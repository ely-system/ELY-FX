# Publica o site no GitHub Pages a cada push na main.
# Antes de publicar, carimba a versão (commit) no código e nos endereços dos arquivos:
# o app compara a versão que está rodando com version.json e se obriga a atualizar.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Carimbar versão
        run: python .github/stamp_version.py "${GITHUB_SHA::7}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
